[project]
name = "k12-sales-assistant"
version = "0.1.0"
description = "K12 智能销售辅助系统"
requires-python = ">=3.13,<3.14"

dependencies = [
    "fastapi==0.115.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]==0.30.6",
    "alembic>=1.13,<2.0",
    "pyjwt>=2.8,<3.0",
    "pwdlib[argon2]>=0.2,<1.0",
    "python-multipart>=0.0.9,<1.0",
    "cryptography>=43,<47",
    "langgraph==1.2.11",
    "openai>=2.50,<3",
    "psycopg[binary]>=3.2,<4",
    "redis>=5,<7",
    "dramatiq[redis]>=1.17,<3",
    "qdrant-client>=1.14,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<1.0",
]
